        const quizContainer = document.getElementById("quiz-container");
        const resultContainer = document.getElementById("result-container");
        const scoreSpan = document.getElementById("score");
        const resultMessage = document.getElementById("result-message");

        function loadQuestion() {
            answered = false;
            explanationBox.classList.add("hidden");
            nextBtn.classList.add("hidden");
            optionsContainer.innerHTML = "";
            
            const q = questions[currentQuestion];
            currentQuestionNum.innerText = currentQuestion + 1;
            questionText.innerText = q.question;

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn w-full text-left bg-gray-50 border-2 border-gray-200 hover:border-teal-400 text-gray-700 font-medium py-3 px-5 rounded-xl shadow-sm focus:outline-none";
                btn.innerText = String.fromCharCode(65 + index) + ". " + opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const allBtns = optionsContainer.children;

            if (selectedIndex === q.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                allBtns[q.correct].classList.add("correct");
            }

            // Disable all buttons
            for (let btn of allBtns) {
                btn.disabled = true;
                btn.classList.add("cursor-not-allowed", "opacity-75");
            }

            explanationText.innerText = q.explanation;
            explanationBox.classList.remove("hidden");
            nextBtn.classList.remove("hidden");
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "Xem kết quả ➔";
            }
        }

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResult();
            }
        };

        function showResult() {
            quizContainer.classList.add("hidden");
            resultContainer.classList.remove("hidden");
            scoreSpan.innerText = score;
            
            let message = "";
            if (score >= 40) message = "Xuất sắc! Bạn đã nắm rất vững kiến thức Quản trị nha khoa. Tự tin bước vào phòng thi nhé! 🎉";
            else if (score >= 25) message = "Khá tốt! Bạn đã có nền tảng cơ bản. Cần ôn lại chút xíu về Tài chính và Pháp lý nhé! 👍";
            else message = "Đừng nản lòng! Khối lượng kiến thức khá lớn, hãy kiên nhẫn đọc lại lời giải thích và làm lại bài thi nhé! 💪";
            
            resultMessage.innerText = message;
        }

        // Init
        loadQuestion();
    </script>
</body>
</html>
